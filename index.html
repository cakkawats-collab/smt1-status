<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status Machine</title>
<style>
/* หน้า 1: ป้ายจริงที่แขวนในไลน์ SMT n > RoHS > Status Machine > แผน | สถานะ
   หน้า 2: บันทึกสถานะ (รอบละ 7 วัน) */
:root{--label:#f3dc1a;--ink:#111;--blue:#1d44a8;--paper:#e9f0ea;--muted:rgba(233,240,234,.6);
  --shade:0 1.2vh 2.6vh rgba(0,0,0,.4),inset 0 .35vh 0 rgba(255,255,255,.55),inset 0 -.7vh 0 rgba(0,0,0,.13);
  --dshade:0 1.2vh 2.6vh rgba(0,0,0,.4),inset 0 .25vh 0 rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body,button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
body{background:radial-gradient(120% 90% at 50% 0%,#15864a 0%,#0b4d28 55%,#06301a 100%);color:var(--ink);
  font-family:"Segoe UI",Roboto,"Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
body.idle{cursor:none}
/* ลายรูกระดานแขวนป้าย */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle,rgba(0,0,0,.35) 0 .28vh,transparent .34vh);background-size:3.2vh 3.2vh}

/* ---------- หน้า 1: ป้ายแสดงผล (ใช้หน่วย vh/vw จึงพอดีทุกขนาดจอ) ---------- */
#disp{position:relative;height:100vh;padding:2.2vh 2vw;display:flex;flex-direction:column;gap:2.2vh}
#disp>*{min-height:0}
.card{position:relative;overflow:hidden;isolation:isolate;transform-origin:50% 0;border-radius:1.6vh;
  border:.4vh solid rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:var(--shade);transition:background-color .5s,color .5s}
.card>span,.box{position:relative;z-index:2}

/* แสงกระจายตอนเปลี่ยนสถานะ */
.card::before{content:"";position:absolute;inset:-25%;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.85) 0%,transparent 60%)}
.card.flash::before{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(1.4)}}

/* ป้ายตกลงมาแขวนตอนเปิดจอ */
#disp .in{animation:hang .95s cubic-bezier(.2,1.2,.35,1) both;animation-delay:calc(var(--i)*110ms)}
@keyframes hang{0%{opacity:0;transform:translateY(-8vh) rotate(-2.5deg)}55%{opacity:1;transform:translateY(.8vh) rotate(1deg)}
  80%{transform:translateY(-.3vh) rotate(-.4deg)}100%{transform:none}}

.sign{flex:22;border:.9vh solid var(--blue);color:var(--blue);font-size:17vh;font-weight:800;line-height:1;letter-spacing:.01em;
  background:linear-gradient(#fff,#e9eef9)}
.sign>.clock{position:absolute;top:1.4vh;right:1.6vw;font-size:3.6vh;font-weight:700;line-height:1;letter-spacing:0;
  font-variant-numeric:tabular-nums;color:var(--blue);opacity:.85}
.rohs{flex:14;border:.9vh solid #fff;color:#fff;font-size:10vh;font-weight:800;line-height:1;letter-spacing:.03em;
  background:linear-gradient(#18a04a,#0d7231)}
.rohs span{display:flex;align-items:center;gap:2vw}
.rohs svg{height:8vh;width:8vh;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.hd{flex:12;background:linear-gradient(#fae84c,#e6cc0b);font-size:7.5vh;font-weight:700}
.hd>.live{position:absolute;left:2.4vw;top:50%;width:2.4vh;height:2.4vh;margin-top:-1.2vh;border-radius:50%;
  background:#15a347;box-shadow:0 0 0 .35vh rgba(0,0,0,.28)}
.hd>.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:#15a347;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.9);opacity:0}}

/* ปุ่มเปลี่ยนหน้า */
.pbtn{display:flex;align-items:center;gap:.7vw;height:5.6vh;padding:0 1.3vw;border-radius:99vh;cursor:pointer;
  border:.3vh solid rgba(0,0,0,.4);font-family:inherit;font-size:2.4vh;font-weight:700;white-space:nowrap;transition:transform .12s,background-color .2s}
.pbtn:active{transform:scale(.95)}
.pbtn:focus-visible{outline:.4vh solid #fff;outline-offset:.3vh}
.pbtn svg{width:2.6vh;height:2.6vh;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.key{padding:.15vh .5vw;border-radius:.6vh;border:.2vh solid currentColor;font-size:1.7vh;font-weight:800;opacity:.75}
.hd>.pbtn{position:absolute;right:1.4vw;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.1);color:var(--ink)}
.hd>.pbtn:active{transform:translateY(-50%) scale(.95)}
.hd>.pbtn:hover{background:rgba(0,0,0,.18)}

/* ---------- ช่องแผน / สถานะ ---------- */
.mid{flex:42;display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.mid .card{background-image:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 45%,rgba(0,0,0,.09))}
.box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;padding:0 1.5vw}
.ico{display:block;width:10.5vh;height:10.5vh}
.ico:empty{display:none}
.ico svg,.ic svg{width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico .f,.ic .f{fill:currentColor;stroke:none}
.val{font-size:8.8vh;font-weight:800;line-height:1.05}
.since{font-size:3.4vh;font-weight:700;opacity:.72;font-variant-numeric:tabular-nums}
.since:empty{display:none}

/* ข้อความใหม่เด้งขึ้นมาแทนของเดิม */
.swap{animation:swapIn .6s cubic-bezier(.2,1.3,.4,1) both}
.ico.swap{animation-delay:.06s}
@keyframes swapIn{0%{opacity:0;transform:translateY(35%) scale(.9)}100%{opacity:1;transform:none}}

/* ไอคอนเคลื่อนไหวตามสถานะ */
[data-fx=ok] .ico svg{animation:breathe 3s ease-in-out infinite}
[data-fx=fast] .ico svg{animation:nudge 1.6s ease-in-out infinite}
[data-fx=delay] .hand{transform-box:view-box;transform-origin:12px 12px;animation:spin 4s linear infinite}
[data-fx=run] .ico svg{animation:spin 5s linear infinite}
[data-fx=swap] .ico svg{animation:flip 3.2s ease-in-out infinite}
[data-fx=new] .ico svg{animation:twinkle 2.2s ease-in-out infinite}
[data-fx=maint] .ico svg{transform-origin:30% 70%;animation:wiggle 2.6s ease-in-out infinite}
[data-fx=stop] .ico svg{animation:blink 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes nudge{0%,100%{transform:translateX(-9%)}50%{transform:translateX(9%)}}
@keyframes flip{0%,35%{transform:rotate(0)}50%,85%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.16) rotate(18deg)}}
@keyframes wiggle{0%,55%,100%{transform:rotate(0)}10%{transform:rotate(-18deg)}22%{transform:rotate(14deg)}34%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* แถบลายวิ่ง: สายพาน (เดินเครื่อง), ลายเตือน (ซ่อมบำรุง), ลายเฉียงเต็มป้าย (หยุดไลน์) */
.fx{position:absolute;inset:0;z-index:0;pointer-events:none}
.fx::before,.fx::after{content:"";position:absolute;left:-3vh;width:calc(100% + 6vh)}
[data-fx=run] .fx::after,[data-fx=swap] .fx::after{bottom:0;height:1.5vh;
  background:repeating-linear-gradient(-45deg,rgba(0,0,0,.24) 0 1vh,rgba(255,255,255,.3) 1vh 2vh);animation:belt .9s linear infinite}
[data-fx=maint] .fx::before,[data-fx=maint] .fx::after{height:2vh;
  background:repeating-linear-gradient(-45deg,#151515 0 1vh,#f3dc1a 1vh 2vh);animation:belt 1.3s linear infinite}
[data-fx=maint] .fx::before{top:0}
[data-fx=maint] .fx::after{bottom:0}
[data-fx=stop] .fx::before{top:0;bottom:0;left:-9vh;width:calc(100% + 18vh);
  background:repeating-linear-gradient(-45deg,rgba(0,0,0,.16) 0 3vh,transparent 3vh 6vh);animation:beltBig 3s linear infinite}
@keyframes belt{to{transform:translateX(2.8284vh)}}
@keyframes beltBig{to{transform:translateX(8.4853vh)}}
.mid .card[data-fx=stop]{animation:alarm 1.2s ease-in-out infinite}
@keyframes alarm{0%,100%{box-shadow:var(--shade),0 0 0 0 rgba(255,70,70,0)}50%{box-shadow:var(--shade),0 0 4.5vh 1.3vh rgba(255,70,70,.8)}}

.sel{outline:.9vh dashed #fff;outline-offset:.5vh}

/* ---------- หน้า 2: บันทึกสถานะ ---------- */
#logp{display:none;height:100vh;padding:2.2vh 2vw;flex-direction:column;gap:1.8vh;color:var(--paper)}
body.p2 #disp{display:none}
body.p2 #logp{display:flex}
.pagein{animation:pageIn .5s cubic-bezier(.2,1,.4,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}

.lp-hd{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:1.4vw;padding:1.4vh 1.4vw 1.4vh 1.8vw;
  border-radius:1.6vh;border:.4vh solid rgba(0,0,0,.5);background:linear-gradient(#fae84c,#e6cc0b);color:var(--ink);box-shadow:var(--shade)}
.lp-title{font-size:4.2vh;font-weight:800;white-space:nowrap;line-height:1}
.lp-period{font-size:2.1vh;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lp-period b{font-weight:800}
.lp-now{display:flex;align-items:center;gap:1.2vw}
.nowchip{display:flex;align-items:center;gap:.6vw;padding:.7vh 1.2vw;border-radius:99vh;border:.3vh solid rgba(0,0,0,.35);
  font-size:2.6vh;font-weight:800;white-space:nowrap;transition:background-color .4s,color .4s}
.nowchip .ic{width:2.8vh;height:2.8vh}
.lp-clock{font-size:2.8vh;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lp-hd .pbtn{background:#18231c;color:#fff}
.lp-hd .pbtn:hover{background:#24342a}

.dot{width:1.5vh;height:1.5vh;border-radius:50%;flex:none;box-shadow:0 0 0 .2vh rgba(0,0,0,.35)}
.panel{min-height:0;display:flex;flex-direction:column;gap:1vh;padding:1.4vh 1.4vw;border-radius:1.6vh;
  border:.4vh solid rgba(0,0,0,.55);background:linear-gradient(#1a261e,#0f1712);box-shadow:var(--dshade)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:2vw;font-size:2.7vh;font-weight:700;white-space:nowrap}
.ph .hint{font-size:2vh;font-weight:500;color:var(--muted)}
.legend{display:flex;gap:1.2vw;font-size:1.9vh;font-weight:500;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:.4vw}

/* การ์ดสรุปแต่ละสถานะ */
.tiles{flex:none;height:16vh;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1.4vw}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:1.3vh 1.3vw 1.2vh 1.8vw;
  border-radius:1.4vh;border:.4vh solid rgba(0,0,0,.55);background:linear-gradient(#1f2d24,#121b15);box-shadow:var(--dshade)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.9vh;background:var(--c)}
.tt{display:flex;align-items:center;gap:.7vw;font-size:2.6vh;font-weight:700;white-space:nowrap}
.tt .ic{width:3vh;height:3vh;color:var(--c)}
.tbig{line-height:1;font-variant-numeric:tabular-nums}
.tbig b{font-size:6vh;font-weight:800}
.tbig i{font-style:normal;font-size:2.3vh;font-weight:600;color:var(--muted);margin-left:.4vw}
.tbig small{font-size:2vh;font-weight:600;color:var(--muted);margin-left:.8vw}
.tile.zero .tbig b{opacity:.4}
.tsub{display:flex;justify-content:space-between;gap:1vw;font-size:2vh;color:var(--muted);white-space:nowrap}
.tsub b{color:var(--paper);font-weight:800}

/* ไทม์ไลน์ 7 วัน */
.week{flex:none}
.wrow,.wtick{display:grid;grid-template-columns:10vw minmax(0,1fr) 14.5vw;align-items:center;gap:1.2vw}
.wrow{height:3.4vh}
.wl{font-size:2.2vh;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:.5vw}
.wrow.today .wl{color:#fff;font-weight:800}
.wrow.today .wl::after{content:"วันนี้";font-size:1.6vh;font-weight:700;padding:.1vh .5vw;border-radius:99vh;background:#f3dc1a;color:var(--ink)}
.wrow.fut{opacity:.35}
.wbar{position:relative;height:2.6vh;border-radius:.7vh;overflow:hidden;box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.1);
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 .6vh,transparent .6vh 1.2vh)}
.seg{position:absolute;top:0;bottom:0;box-shadow:inset -.15vh 0 0 rgba(0,0,0,.35)}
.hr{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.14)}
.wnow{position:absolute;top:0;bottom:0;width:.4vh;margin-left:-.2vh;background:#fff;box-shadow:0 0 .8vh #fff}
.wr{font-size:2.2vh;text-align:right;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.wr b{color:#ff8f8f;font-weight:800}
.tk{position:relative;height:2.1vh;font-size:1.8vh;color:var(--muted);font-variant-numeric:tabular-nums}
.tk span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tk span:first-child{transform:none}
.tk span:last-child{transform:translateX(-100%)}

/* เหตุการณ์ล่าสุด */
.evs{flex:1}
.evgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));
  grid-auto-flow:column;column-gap:1.4vw;row-gap:.6vh}
.er{position:relative;overflow:hidden;display:grid;grid-template-columns:1.5vh 13vw minmax(0,1fr) auto;align-items:center;gap:.9vw;
  padding:0 1.1vw 0 1.4vw;border-radius:1vh;background:rgba(255,255,255,.05);font-size:2.4vh;min-width:0}
.er::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.6vh;background:var(--c)}
.er .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .w{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.er.live{background:rgba(255,255,255,.12)}
.er.live .dot{animation:blink 1.2s ease-in-out infinite}
.er.new{animation:evIn .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes evIn{0%{opacity:0;transform:translateX(-3vw)}100%{opacity:1;transform:none}}
.du{white-space:nowrap;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.du b{font-size:3vh;font-weight:800}
.du i{font-style:normal;font-size:1.8vh;font-weight:600;color:var(--muted);margin-left:.3vw}
.eempty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;border-radius:1vh;
  background:rgba(255,255,255,.04);font-size:2.6vh;color:var(--muted)}

/* ปุ่มส่งออก Excel และข้อความแจ้ง */
.lp-hd .pbtn.xl{background:#107c41;color:#fff}
.lp-hd .pbtn.xl:hover{background:#13924d}
#toast{position:fixed;left:50%;bottom:4vh;z-index:60;padding:1.2vh 1.6vw;border-radius:99vh;background:#fff;color:#111;font-size:2.3vh;font-weight:700;
  box-shadow:0 1vh 3vh rgba(0,0,0,.45);opacity:0;transform:translate(-50%,2vh);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* เมนูบนหน้าบันทึก (ใช้รีโมตได้ทั้งหมด) */
#menu{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#menu.on{display:flex}
.mbox{width:min(50vw,96vh);padding:2.4vh 1.8vw 1.8vh;border-radius:2vh;border:.4vh solid rgba(0,0,0,.6);color:var(--paper);
  background:linear-gradient(#1f2d24,#121b15);box-shadow:0 2vh 6vh rgba(0,0,0,.6);animation:menuIn .25s cubic-bezier(.2,1.2,.4,1)}
@keyframes menuIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.mtitle{font-size:3vh;font-weight:800;margin:0 0 1.6vh .4vw}
.mi{display:flex;align-items:center;gap:1vw;width:100%;height:6.3vh;padding:0 1.3vw;margin-bottom:.8vh;border-radius:1.2vh;cursor:pointer;
  border:.3vh solid transparent;background:rgba(255,255,255,.06);color:inherit;font-family:inherit;font-size:2.7vh;font-weight:700;text-align:left;
  transition:background-color .15s,transform .15s}
.mi svg{width:3.2vh;height:3.2vh;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mi.xl svg{color:#3fcf7c}
.mi.ht svg{color:#7fb8ff}
.mi small{margin-left:auto;font-size:2.1vh;font-weight:600;color:var(--muted);white-space:nowrap}
.mi.cur{background:#f3dc1a;border-color:#fff;color:#111;transform:scale(1.02)}
.mi.cur svg,.mi.cur small{color:#111}
.mhint{margin-top:1.2vh;font-size:2vh;color:var(--muted);text-align:center}
.mhint b{color:var(--paper)}

/* เลือกวันเพื่อดูย้อนหลัง */
.ph .hint{margin-left:1vw}
#weekRows{display:flex;flex-direction:column;gap:.3vh}
.wrow,.wtick{padding:0 .6vw;margin:0 -.6vw}
.wrow{border-radius:.9vh;cursor:pointer;transition:background-color .2s}
.wrow:hover{background:rgba(255,255,255,.05)}
.wrow.pick{background:rgba(243,220,26,.13);box-shadow:inset .5vh 0 0 #f3dc1a}
.wrow.pick .wl{color:#f3dc1a}
.wrow.fut{cursor:default}
.wrow.fut:hover{background:none}
.seg{min-width:.35vh}
.seg:hover{filter:brightness(1.25)}
#tip{position:fixed;z-index:50;pointer-events:none;display:flex;align-items:center;gap:.6vw;padding:.9vh 1.1vw;border-radius:1vh;
  background:#fff;color:#111;font-size:2.2vh;white-space:nowrap;font-variant-numeric:tabular-nums;
  box-shadow:0 1vh 3vh rgba(0,0,0,.45);opacity:0;transform:translate(-50%,calc(-100% - 1.6vh));transition:opacity .15s}
#tip.on{opacity:1}
#tip .tdu{padding:.2vh .6vw;border-radius:99vh;background:#111;color:#fff;font-weight:700}
.evtools{display:flex;align-items:center;gap:.7vw;font-size:2vh;font-weight:600}
.evsum{color:var(--muted);margin-right:1vw}
.evsum b{color:#ff8f8f}
.mini{height:4.2vh;min-width:4.2vh;padding:0 1vw;border-radius:99vh;border:.2vh solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);
  color:var(--paper);font-family:inherit;font-size:2vh;font-weight:700;cursor:pointer}
.mini:hover{background:rgba(255,255,255,.14)}
.mini.on{background:#f3dc1a;border-color:#f3dc1a;color:#111}
.mini:disabled{opacity:.3;cursor:default}
.mini:focus-visible{outline:.3vh solid #fff}
#evPg{min-width:5vw;text-align:center;font-variant-numeric:tabular-nums}
.er.hl{animation:hl 1.8s ease-out}
@keyframes hl{0%,35%{background:rgba(243,220,26,.45)}100%{background:rgba(255,255,255,.05)}}

/* ---------- หน้าควบคุม (เปิดด้วย #control หรือกดปุ่ม C) ---------- */
#ctl{display:none;min-height:100vh;padding:20px;background:#15171a;color:#eee;overflow:auto}
body.ctl{overflow:auto}
body.ctl #disp,body.ctl #logp{display:none}
body.ctl #ctl{display:block}
#ctl h1{font-size:20px;margin:0 0 4px}
#ctl p{margin:0 0 18px;color:#aab;font-size:14px;line-height:1.5}
.row{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;max-width:520px;margin-bottom:12px}
.row button{height:64px;border:0;border-radius:12px;background:#2a2e34;color:#8ec5ff;font-size:28px;cursor:pointer;transition:transform .1s}
.row button:active{background:#3a7bd5;color:#fff;transform:scale(.94)}
.row button:focus-visible,#ctl .back:focus-visible{outline:3px solid #fff}

  text-align:center;padding:0 8px;transition:background-color .35s,color .35s;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}

<body>

<!-- หน้า 1: ป้าย -->
<div id="disp">
  <div class="card sign" style="--i:0"><span id="vl"></span><span class="clock" id="clk"></span></div>
  <div class="card rohs" id="vr" style="--i:1"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>RoHS</span></div>
  <div class="card hd" style="--i:2"><span class="live"></span><span>Status Machine</span>
    <button class="pbtn" id="toLog"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>บันทึกสถานะ<span class="key">OK</span></button></div>
  <div class="mid">
    <div class="card" id="cp" style="--i:3"><div class="fx"></div><div class="box"><span class="ico" id="ip"></span><span class="val" id="vp"></span></div></div>
    <div class="card" id="cs" style="--i:4"><div class="fx"></div><div class="box"><span class="ico" id="is"></span><span class="val" id="vs"></span><span class="since" id="ts"></span></div></div>
  </div>
</div>

<!-- หน้า 2: บันทึกสถานะ -->
<div id="logp">
  <header class="lp-hd">
    <div class="lp-title" id="lpTitle"></div>
    <div class="lp-period" id="lpPeriod"></div>
    <div class="lp-now"><span class="nowchip" id="lpNow"></span><span class="lp-clock" id="lpClk"></span></div>
    <button class="pbtn xl" id="exportXl"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>ส่งออก</button>
    <button class="pbtn" id="toSign"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>หน้าป้าย</button>
  </header>
  <section class="tiles" id="tiles"></section>
  <section class="panel week">
    <div class="ph"><span>ไทม์ไลน์ 7 วัน<span class="hint">▲▼ เลือกวัน &nbsp;◀▶ เปลี่ยนหน้า &nbsp;OK เมนู</span></span><span class="legend" id="legend"></span></div>
    <div id="weekRows"></div>
    <div class="wtick"><span></span><div class="tk" id="wticks"></div><span></span></div>
  </section>
  <section class="panel evs">
    <div class="ph"><span id="evTitle"></span>
      <span class="evtools"><span class="evsum" id="evSum"></span>
        <button class="mini" id="evAll">รวม Production</button>
        <button class="mini" id="evPrev" aria-label="หน้าก่อน">◀</button><span id="evPg"></span><button class="mini" id="evNext" aria-label="หน้าถัดไป">▶</button></span></div>

<div id="toast"></div>

  <div class="mhint"><b>▲▼</b> เลือก &nbsp; <b>OK</b> ตกลง &nbsp; <b>◀</b> ปิดเมนู</div></div></div>

<div id="ctl">
  <h1>ควบคุมป้าย Status Machine</h1>
  <p>กดลูกศรเพื่อเปลี่ยนสถานะ จอแสดงผลจะเปลี่ยนตามทันที</p>
  <div class="lab">แผนการผลิต</div><div class="row"><button data-k="p" data-d="-1" aria-label="แผนก่อนหน้า">◀</button><div class="chip" id="kp"></div><button data-k="p" data-d="1" aria-label="แผนถัดไป">▶</button></div>
  <div class="lab">สถานะเครื่อง</div><div class="row"><button data-k="s" data-d="-1" aria-label="สถานะก่อนหน้า">◀</button><div class="chip" id="ks"></div><button data-k="s" data-d="1" aria-label="สถานะถัดไป">▶</button></div>
  <button class="back" id="toDisp">ดูหน้าป้าย</button><button class="back" id="toDisp2">ดูหน้าบันทึกสถานะ</button><button class="back" id="exportXl2">ส่งออก Excel</button><button class="back" id="exportHt2">ส่งออก HTML</button><button class="back warn" id="clearLog">ล้างบันทึกและเริ่มรอบใหม่</button>
</div>

<script>
/*
  วิธีใช้
  - เปิดไฟล์นี้ใน Chrome บน Android box แล้วกด F11 หรือดับเบิลคลิกเพื่อเต็มจอ
  - รีโมตกล่อง Android: ลูกศร ขึ้น/ลง เลือกช่อง ซ้าย/ขวา เปลี่ยนสถานะ
  - ปุ่ม OK (Enter) หรือปุ่ม L สลับหน้าป้าย <-> หน้าบันทึกสถานะ (หรือกดปุ่มบนจอ)
  - หน้าบันทึก: ลูกศร ขึ้น/ลง เลือกวัน ซ้าย/ขวา เปลี่ยนหน้ารายการ OK เปิดเมนู
    (กลับหน้าป้าย / ส่งออก Excel เฉพาะวันที่เลือก หรือทั้งรอบ 7 วัน / แสดง Production)
  - ส่งออก Excel (.xlsx) หรือรายงาน HTML ได้จากเมนูหน้าบันทึก หรือหน้าควบคุม สร้างในเครื่อง ไม่ต้องต่อเน็ต
    มี 4 ชีต: สรุป / รายวัน / หยุดไลน์รายชั่วโมง / เหตุการณ์
  - เปลี่ยนสถานะแล้วอยู่ไม่ถึง 5 วินาที (กดเลื่อนผ่าน) จะไม่ถูกนับ แก้ได้ที่ IGNORE_SEC
  - ปุ่ม C สลับไปหน้าควบคุม (หรือเปิดด้วย #control, เปิดหน้าบันทึกตรงๆ ด้วย #log)
  - ?line=SMT%202      เปลี่ยนชื่อไลน์
  - ?rohs=0            ซ่อนป้าย RoHS (ค่าปกติแสดงอยู่)
  - ?clock=0           ซ่อนนาฬิกาที่มุมขวาบนของป้าย SMT
  - ?timer=0           ซ่อนระยะเวลาที่อยู่ในสถานะปัจจุบัน
  - ?back=120          หน้าบันทึกกลับไปหน้าป้ายเองเมื่อไม่มีใครกดอะไร (วินาที, 0 = ไม่กลับเอง)
  - ?demo=1            เล่นสลับสถานะอัตโนมัติ เพื่อทดสอบ
  - ?src=http://IP     ซิงก์กับอุปกรณ์อื่นผ่าน HTTP (ต้องมีตัวรับ /state และ /set) ดูท้ายไฟล์
  บันทึกสถานะเก็บในเครื่องนี้ เป็นรอบละ 7 วัน ครบรอบแล้วล้างเองตอนเที่ยงคืนและเริ่มรอบใหม่
*/
// ซ้าย = แผน, ขวา = สถานะ
// เพิ่ม/ลด/สลับลำดับตัวเลือกได้ที่นี่ รูปแบบ ["ข้อความ","สีพื้น","สีตัวอักษร (เว้นว่าง = ดำ)","ไอคอน/เอฟเฟกต์"]
// ไอคอนที่มี: ok fast delay none run swap new maint stop (เว้นว่าง = ไม่มีไอคอน)
// ลำดับในรายการคือลำดับที่กดลูกศรเลื่อนไป ตัวแรกคือค่าเริ่มต้น
const OPT = {
  p: [["On Plan","#7cc47c","","ok"],["Advance Plan","#6fd6c8","","fast"],["Delay Plan","#f0dc1e","","delay"],["No Plan","#c9c9c9","","none"]],
  s: [["Production","#9ad79a","","run"],["Change model","#a9d6f2","","swap"],["New Model","#e9a3b8","","new"],["Maintenance","#f0dc1e","","maint"],["Stop line","#d62f2f","#fff","stop"]]
};
// สถานะที่ไม่ต้องขึ้นในการ์ดสรุปและรายการเหตุการณ์ (ยังแสดงบนไทม์ไลน์) ใส่เป็นลำดับใน OPT.s เช่น 0 = Production
const LOG_SKIP = [0];
const PERIOD_DAYS = 7;   // ล้างบันทึกทุกกี่วัน
const IGNORE_SEC = 5;    // สถานะที่อยู่สั้นกว่านี้ (วินาที) ไม่นับ เช่น ตอนกดรีโมตเลื่อนผ่าน
const IC = {
  ok:'<circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/>',
  fast:'<path class="f" d="M2.5 6.5l8 5.5-8 5.5z"/><path class="f" d="M12 6.5l8 5.5-8 5.5z"/>',
  delay:'<circle cx="12" cy="12" r="10"/><path d="M12 12h4.5"/><path class="hand" d="M12 12V5.5"/>',
  none:'<circle cx="12" cy="12" r="10"/><path d="M7.5 12h9"/>',
  run:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',
  swap:'<path d="M4 8.5h15l-4-4"/><path d="M20 15.5H5l4 4"/>',
  new:'<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/>',
  maint:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.5-.6-.6-2.5z"/>',
  stop:'<path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"/><path d="M12 7v6.5M12 17v.01"/>'
};
const svg = fx => IC[fx] ? '<svg viewBox="0 0 24 24" aria-hidden="true">' + IC[fx] + '</svg>' : "";
const KEYS = ["p","s"];
const qs = new URLSearchParams(location.search);
const SRC = (qs.get("src") || "").replace(/\/$/, "");
const LINE = qs.get("line") || "SMT 1";
const $ = id => document.getElementById(id);
if (qs.get("rohs") === "0") $("vr").style.display = "none";
const SHOW_CLOCK = qs.get("clock") !== "0", SHOW_TIMER = qs.get("timer") !== "0";
const BACK = qs.has("back") ? (parseInt(qs.get("back"), 10) || 0) : 120;

function clean(o){
  const r = {};
  KEYS.forEach(k => {
    const v = parseInt(o && o[k], 10);
    r[k] = (v >= 0 && v < OPT[k].length) ? v : 0;
  });
  return r;
}
let st = {p:0,s:0};
try { st = clean(JSON.parse(localStorage.getItem("smt-status") || "{}")); } catch(e){}
let since = Date.now();
try { since = parseInt(localStorage.getItem("smt-since"), 10) || since; } catch(e){}
const bc = "BroadcastChannel" in window ? new BroadcastChannel("smt-status") : null;

function retrigger(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const targets = { p:["cp","vp","kp","ip"], s:["cs","vs","ks","is"] };
function render(changed){
  $("vl").textContent = LINE;
  KEYS.forEach(k => {
    const [name, color, fg, fx] = OPT[k][st[k]];
    const [card, val, chip, ico] = targets[k];
    const c = $(card);
    $(val).textContent = name;
    $(chip).textContent = name;
    $(chip).style.backgroundColor = color;
    $(chip).style.color = fg || "";
    c.style.backgroundColor = color;
    c.style.color = fg || "";
    if (c._fx !== (fx || "")) {           // เปลี่ยนไอคอนเฉพาะตอนสถานะเปลี่ยน ไม่ให้แอนิเมชันสะดุด
      c._fx = fx || "";
      c.dataset.fx = c._fx;
      $(ico).innerHTML = svg(fx);
    }
    if (changed && changed.includes(k)) {
      retrigger(c, "flash"); retrigger($(val), "swap"); retrigger($(ico), "swap");
    }
  });
}

/* ---------- บันทึกสถานะ: รายการ {s: ลำดับสถานะ, t: เวลาเริ่ม}  รอบละ PERIOD_DAYS วัน ---------- */
const DAY = 864e5;
const TH_DAY = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const pad = n => String(n).padStart(2, "0");
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dm = ts => { const d = new Date(ts); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); };
const dayLabel = ts => TH_DAY[new Date(ts).getDay()] + " " + dm(ts);
function midnight(ts){ const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function addDays(ts, n){ const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); }
function loadLog(){
  try {
    const a = JSON.parse(localStorage.getItem("smt-log") || "[]");
    return Array.isArray(a) ? compact(a.filter(e => e && e.s >= 0 && e.s < OPT.s.length && e.t > 0)) : [];
  } catch(e){ return []; }
}
// ตัดสถานะที่อยู่ไม่ถึง IGNORE_SEC วินาทีทิ้ง (เช่นกดเลื่อนผ่าน) แล้วรวมช่วงที่เป็นสถานะเดียวกันติดกัน
function compact(a){
  const out = [];
  a.forEach((e, i) => {
    const next = a[i + 1];
    if (next && next.t - e.t < IGNORE_SEC * 1000) return;
    if (out.length && out[out.length - 1].s === e.s) return;
    out.push(e);
  });
  return out;
}
function saveLog(a){ try { localStorage.setItem("smt-log", JSON.stringify(a)); } catch(e){} }
function logStatus(s, t){
  const a = loadLog();
  if (a.length && a[a.length - 1].s === s) return;
  a.push({s, t: Math.max(t, pStart)}); saveLog(a);
}
// ตรวจรอบ 7 วัน: ครบรอบเมื่อไรล้างข้อมูลและเริ่มรอบใหม่ (ยกสถานะปัจจุบันข้ามไปด้วย)
let pStart = 0;
function checkPeriod(){
  const today = midnight(Date.now());
  let ps = parseInt(localStorage.getItem("smt-period"), 10);
  if (!ps || ps > today) { const a = loadLog(); ps = a.length ? Math.max(midnight(a[0].t), addDays(today, 1 - PERIOD_DAYS)) : today; }
  let reset = false;
  while (today >= addDays(ps, PERIOD_DAYS)) { ps = addDays(ps, PERIOD_DAYS); reset = true; }
  if (reset) {
    let cur = null; const keep = [];
    loadLog().forEach(e => { if (e.t < ps) cur = e.s; else keep.push(e); });
    if (cur !== null && (!keep.length || keep[0].t > ps)) keep.unshift({s:cur, t:ps});
    saveLog(keep);
  }
  if (ps !== pStart) { pStart = ps; try { localStorage.setItem("smt-period", ps); } catch(e){} }
  return reset;
}
function dur(ms){
  const sec = Math.max(0, Math.floor(ms / 1000));
  if (sec < 60) return sec ? "<b>" + sec + "</b><i>วินาที</i>" : "<b>0</b><i>นาที</i>";
  const m = Math.floor(sec / 60);
  if (m < 60) return "<b>" + m + "</b><i>นาที</i>";
  return "<b>" + Math.floor(m / 60) + ":" + pad(m % 60) + "</b><i>ชม.</i>";
}
function durText(ms){
  const m = Math.floor(ms / 60000);
  if (m < 1) return ms > 0 ? "ไม่ถึง 1 นาที" : "0 นาที";
  return m < 60 ? m + " นาที" : Math.floor(m / 60) + " ชม. " + pad(m % 60) + " นาที";
}
// ขีดชั่วโมงและป้ายเวลา สร้างครั้งเดียว
let HOURS = "";
for (let i = 1; i < 24; i++) HOURS += '<div class="hr" style="left:' + (i / 24 * 100) + '%"></div>';
$("wticks").innerHTML = [0,3,6,9,12,15,18,21,24].map(i => '<span style="left:' + (i / 24 * 100) + '%">' + pad(i) + ':00</span>').join("");
$("legend").innerHTML = OPT.s.map(o => '<span><span class="dot" style="background:' + o[1] + '"></span>' + o[0] + '</span>').join("");
const STOPS = OPT.s.map((o, i) => o[3] === "stop" ? i : -1).filter(i => i >= 0);

function renderLog(fresh){
  const a = loadLog(), now = Date.now(), d0 = midnight(now);
  const iv = a.map((e, i) => ({s:e.s, a:Math.max(e.t, pStart), b: i + 1 < a.length ? a[i + 1].t : now, live: i === a.length - 1}))
              .filter(x => x.b > x.a);
  const clip = (x, A, B) => Math.max(0, Math.min(x.b, B) - Math.max(x.a, A));
  const [nm, nc, nf, nfx] = OPT.s[st.s];

  // หัวหน้า
  $("lpTitle").textContent = "บันทึกสถานะ " + LINE;
  const end = addDays(pStart, PERIOD_DAYS), left = Math.round((end - d0) / DAY);
  $("lpPeriod").innerHTML = 'รอบ <b>' + dm(pStart) + ' – ' + dm(addDays(pStart, PERIOD_DAYS - 1)) + '</b><br>' +
    (left <= 1 ? 'ล้างข้อมูล <b>เที่ยงคืนนี้</b>' : 'ล้างข้อมูลในอีก <b>' + left + ' วัน</b>');
  const chip = $("lpNow");
  chip.style.backgroundColor = nc; chip.style.color = nf || "";
  chip.innerHTML = '<span class="ic">' + svg(nfx) + '</span>ตอนนี้: ' + nm;

  // การ์ดสรุปแต่ละสถานะ (เรียงจากรุนแรงสุด)
  const list = OPT.s.map((o, i) => i).filter(i => !LOG_SKIP.includes(i)).reverse();
  $("tiles").innerHTML = list.map(s => {
    const all = iv.filter(x => x.s === s), td = all.filter(x => x.b > d0);
    const ms = all.reduce((t, x) => t + x.b - x.a, 0), tms = td.reduce((t, x) => t + clip(x, d0, d0 + DAY), 0);
    return '<div class="tile' + (all.length ? '' : ' zero') + '" style="--c:' + OPT.s[s][1] + '">' +
      '<div class="tt"><span class="ic">' + svg(OPT.s[s][3]) + '</span>' + OPT.s[s][0] + '</div>' +
      '<div class="tbig">' + dur(ms) + '<small>รวมทั้งรอบ</small></div>' +
      '<div class="tsub"><span><b>' + all.length + '</b> ครั้งในรอบนี้</span><span>วันนี้ <b>' + td.length + '</b> ครั้ง <b>' + durText(tms) + '</b></span></div></div>';
  }).join("");

  // ไทม์ไลน์รายวัน (แตะแถวเพื่อเลือกวัน)
  IV = iv;
  if (!selDay || selDay < pStart || selDay > d0) selDay = d0;
  let rows = "";
  for (let i = 0; i < PERIOD_DAYS; i++) {
    const A = addDays(pStart, i), B = addDays(pStart, i + 1), fut = A > now, isToday = A === d0;
    let segs = HOURS, stopMs = 0;
    if (!fut) iv.forEach((x, k) => {
      const w = clip(x, A, B); if (!w) return;
      if (STOPS.includes(x.s)) stopMs += w;
      segs += '<div class="seg" data-k="' + k + '" style="left:' + ((Math.max(x.a, A) - A) / (B - A) * 100) + '%;width:' + (w / (B - A) * 100) + '%;background:' + OPT.s[x.s][1] + '"></div>';
    });
    if (isToday) segs += '<div class="wnow" style="left:' + ((now - A) / (B - A) * 100) + '%"></div>';
    rows += '<div class="wrow' + (fut ? ' fut' : '') + (isToday ? ' today' : '') + (A === selDay ? ' pick' : '') + '" data-day="' + A + '">' +
      '<span class="wl">' + dayLabel(A) + '</span><div class="wbar">' + segs + '</div><span class="wr">' +
      (fut ? '' : stopMs ? 'หยุดไลน์ <b>' + durText(stopMs) + '</b>' : 'ไม่มีหยุดไลน์') + '</span></div>';
  }
  $("weekRows").innerHTML = rows;

  // รายละเอียดของวันที่เลือก (ใหม่สุดอยู่บน)

    : 'ไม่มีหยุดไลน์';
  if (hlK !== null) { const idx = dayEv.findIndex(x => x.k === hlK); if (idx >= 0) evPage = Math.floor(idx / PER); }
  evPages = Math.max(1, Math.ceil(dayEv.length / PER));
  evPage = Math.min(Math.max(evPage, 0), evPages - 1);
  $("evPg").textContent = (evPage + 1) + " / " + evPages;
  $("evPrev").disabled = evPage === 0; $("evNext").disabled = evPage >= evPages - 1;
  $("evAll").classList.toggle("on", evAll);
  const when = (t, edge, before) => (before ? dayLabel(t) + " " : "") + hm(t);
  $("evgrid").innerHTML = dayEv.length ? dayEv.slice(evPage * PER, evPage * PER + PER).map((x, i) => {
    const o = OPT.s[x.s];

/* ---------- ส่งออก Excel (.xlsx) สร้างไฟล์เองในเครื่อง ไม่ต้องใช้อินเทอร์เน็ต ---------- */
const XL = (() => {
  const CRC = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC[n] = c >>> 0; }

    const enc = new TextEncoder(), parts = [], cen = []; let off = 0;

      const nb = enc.encode(name), db = enc.encode(text), crc = crc32(db);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, db.length, true); h.setUint32(22, db.length, true);
      h.setUint16(26, nb.length, true);
      parts.push(new Uint8Array(h.buffer), nb, db);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, db.length, true); c.setUint32(24, db.length, true);
      c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
      cen.push(new Uint8Array(c.buffer), nb);
      off += 30 + nb.length + db.length;

    const size = cen.reduce((t, b) => t + b.length, 0), e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);

    const F_HEAD = fill("#0B4D28"), F_TOT = fill("#FFF3B0"), F_RED = fill("#FDE2E1"), F_SUB = fill("#E8F3EC");
    const fonts = [
      '<font><sz val="11"/><name val="Tahoma"/></font>',

      '<font><b/><sz val="12"/><color rgb="FF0B4D28"/><name val="Tahoma"/></font>',

      '<numFmt numFmtId="169" formatCode="[h]:mm"/><numFmt numFmtId="170" formatCode="0.0;-0.0;&quot;–&quot;"/><numFmt numFmtId="171" formatCode="0.0%"/></numFmts>' +

      '<cellXfs count="' + xfs.length + '">' + xfs.join("") + '</cellXfs>' +

  }

  // rows: [[ค่า, รูปแบบ], ...] ค่าเป็นตัวเลข ข้อความ หรือ {f:"สูตร"}; ใส่ "" เพื่อให้มีกรอบแต่ไม่มีค่า
  function sheet(rows, o){
    const sd = rows.map((r, ri) => {

      return '<row r="' + (ri + 1) + '"' + (h ? ' ht="' + h + '" customHeight="1"' : '') + '>' + (r || []).map((c, ci) => {

        if (typeof v === "number") return '<c r="' + ref + '"' + sa + '><v>' + (Math.round(v * 1e9) / 1e9) + '</v></c>';
        if (typeof v === "object") return '<c r="' + ref + '"' + sa + '><f>' + esc(v.f) + '</f></c>';

      }).join("") + '</row>';
    }).join("");
    const fr = o.freeze || {r:0, c:0};
    const pane = fr.r || fr.c ? '<pane' + (fr.c ? ' xSplit="' + fr.c + '"' : '') + (fr.r ? ' ySplit="' + fr.r + '"' : '') +

// day = เวลาเที่ยงคืนของวันที่จะส่งออก หรือ null = ทั้งรอบ
function exportExcel(day){
  checkPeriod();
  const now = Date.now(), d0 = midnight(now), C = XL.col;
  const R0 = day || pStart, R1 = day ? Math.min(addDays(day, 1), now) : now;
  const a = loadLog();
  const iv = a.map((e, i) => ({s:e.s, a:Math.max(e.t, pStart), b: i + 1 < a.length ? a[i + 1].t : now, live: i === a.length - 1}))
              .filter(x => x.b > x.a && x.b > R0 && x.a < R1);
  const clip = (x, A, B) => Math.max(0, Math.min(x.b, B) - Math.max(x.a, A));
  const ser = ts => (ts - new Date(ts).getTimezoneOffset() * 60000) / DAY + 25569;   // วันเวลาแบบ Excel
  const dd = ms => ms / DAY;                                                          // ระยะเวลาแบบ Excel
  const full = ts => dm(ts) + "/" + new Date(ts).getFullYear();
  const hms = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); };
  const ymd = ts => { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const dname = ts => TH_DAY[new Date(ts).getDay()].replace(".", "");
  const note = x => x.live ? "ยังไม่จบ (นับถึงเวลาส่งออก)" : midnight(x.b - 1) !== midnight(x.a) ? "ข้ามวัน" : "";
  const endStyle = (x, S) => midnight((x.live ? now : x.b) - 1) !== midnight(x.a) ? S.dt : S.time;
  const {xml: STY, S} = XL.styles();
  const days = [];
  if (day) days.push(day); else for (let i = 0; i < PERIOD_DAYS; i++) { const A = addDays(pStart, i); if (A <= d0) days.push(A); }
  const sub1 = (day ? "วันที่ " + dname(day) + " " + full(day) : "ช่วงข้อมูล " + full(pStart) + " – " + full(d0)) + "   (ข้อมูลถึง " + full(R1) + " " + hms(R1) + ")";
  const sub2 = "ส่งออกเมื่อ " + full(now) + " " + hms(now) + "   ไม่นับการเปลี่ยนสถานะที่สั้นกว่า " + IGNORE_SEC + " วินาที";
  const title = (rows, t, n) => { rows.push([[t + " " + LINE, S.title]]); rows.push([[sub1, S.sub]]); if (n) rows.push([[n, S.sub]]); else rows.push([[sub2, S.sub]]); rows.push(null); };

  /* ชีต 1: สรุป */
  const s1 = [], m1 = [], h1 = {1: 26};
  title(s1, "รายงานสถานะเครื่อง");
  s1.push([["สรุปตามสถานะ", S.sec]]);
  s1.push(["สถานะ", "จำนวนครั้ง", "เวลารวม\n(ชม.:นาที:วินาที)", "เวลารวม\n(นาที)", "สัดส่วน\nของเวลา", "เฉลี่ยต่อครั้ง\n(นาที)", "นานสุด\n(นาที)", "ครั้งที่นานสุด\nเริ่มเมื่อ"].map(h => [h, S.hd]));
  h1[s1.length] = 36;
  const f1 = s1.length + 1, l1 = s1.length + OPT.s.length, t1 = l1 + 1;
  OPT.s.forEach((o, s) => {
    const ev = iv.filter(x => x.s === s), ms = ev.map(x => clip(x, R0, R1)), tot = ms.reduce((p, q) => p + q, 0);
    const mx = ms.length ? Math.max(...ms) : 0, mxe = ev[ms.indexOf(mx)];
    const r = s1.length + 1;
    s1.push([[o[0], S.st[s]], [ev.length, S.int], [dd(tot), S.dur], [tot / 60000, S.num],
      [{f:"IF($D$" + t1 + ">0,D" + r + "/$D$" + t1 + ",0)"}, S.pct], [{f:"IF(B" + r + ">0,D" + r + "/B" + r + ",0)"}, S.num],
      [mx / 60000, S.num], mxe ? [ser(mxe.a), S.dt] : ["–", S.txtc]]);
  });
  s1.push([["รวมทั้งหมด", S.tTxt], [{f:"SUM(B" + f1 + ":B" + l1 + ")"}, S.tInt], [{f:"SUM(C" + f1 + ":C" + l1 + ")"}, S.tDur],
    [{f:"SUM(D" + f1 + ":D" + l1 + ")"}, S.tNum], [{f:"SUM(E" + f1 + ":E" + l1 + ")"}, S.tPct],
    [{f:"IF(B" + t1 + ">0,D" + t1 + "/B" + t1 + ",0)"}, S.tNum], [{f:"MAX(G" + f1 + ":G" + l1 + ")"}, S.tNum], ["", S.tTxt]]);
  s1.push(null);
  s1.push([["หยุดไลน์นานที่สุด 5 อันดับ", S.sec]]);
  s1.push(["อันดับ", "วันที่", "วัน", "เวลาเริ่ม", "เวลาจบ", "ระยะเวลา\n(ชม.:นาที:วินาที)", "ระยะเวลา\n(นาที)", "หมายเหตุ"].map(h => [h, S.hd]));
  h1[s1.length] = 36;
  const top = iv.filter(x => STOPS.includes(x.s)).sort((p, q) => (q.b - q.a) - (p.b - p.a)).slice(0, 5);
  if (top.length) top.forEach((x, i) => s1.push([[i + 1, S.int], [ser(midnight(x.a)), S.date], [dname(x.a), S.txtc], [ser(x.a), S.time],
    [ser(x.b), endStyle(x, S)], [dd(x.b - x.a), S.dur], [(x.b - x.a) / 60000, S.num], [note(x), S.txt]]));
  else { s1.push([["ไม่มีการหยุดไลน์ในช่วงนี้", S.txtc], ...Array(7).fill(["", S.txtc])]); m1.push("A" + s1.length + ":H" + s1.length); }

  /* ชีต 2: รายวัน */
  const s2 = [], m2 = [], h2 = {1: 26};
  title(s2, "สรุปรายวัน");
  const nS = OPT.s.length, cRec = 2 + nS * 2, cPct = cRec + 1, hr = s2.length + 1;
  const r1 = [["วันที่", S.hd], ["วัน", S.hd]], r2 = [["", S.hd], ["", S.hd]];
  OPT.s.forEach((o, s) => { r1.push([o[0], S.st[s]], ["", S.st[s]]); r2.push(["ครั้ง", S.hd], ["เวลา\n(ชม.:นาที:วินาที)", S.hd]);
    m2.push(C(2 + s * 2) + hr + ":" + C(3 + s * 2) + hr); });
  r1.push(["เวลาที่บันทึก\nทั้งหมด", S.hd], ["สัดส่วน\nเดินเครื่อง", S.hd]); r2.push(["", S.hd], ["", S.hd]);
  [0, 1, cRec, cPct].forEach(c => m2.push(C(c) + hr + ":" + C(c) + (hr + 1)));
  s2.push(r1); s2.push(r2); h2[hr] = 24; h2[hr + 1] = 36;
  const f2 = s2.length + 1;
  const prodCol = OPT.s.findIndex(o => o[3] === "run");
  days.forEach(A => {
    const B = Math.min(addDays(A, 1), now), r = s2.length + 1, row = [[ser(A), S.date], [dname(A), S.txtc]];
    OPT.s.forEach((o, s) => { const ev = iv.filter(x => x.s === s && clip(x, A, B) > 0);
      row.push([ev.length, S.int], [dd(ev.reduce((t, x) => t + clip(x, A, B), 0)), S.dur]); });
    row.push([{f:"SUM(" + OPT.s.map((o, s) => C(3 + s * 2) + r).join(",") + ")"}, S.dur]);
    row.push([prodCol >= 0 ? {f:"IF(" + C(cRec) + r + ">0," + C(3 + prodCol * 2) + r + "/" + C(cRec) + r + ",0)"} : "", S.pct]);
    s2.push(row);
  });
  const l2 = s2.length, t2 = l2 + 1, tr = [["รวมทั้งหมด", S.tTxt], ["", S.tTxt]];
  for (let c = 2; c <= cRec; c++) tr.push([{f:"SUM(" + C(c) + f2 + ":" + C(c) + l2 + ")"}, (c - 2) % 2 === 0 && c < cRec ? S.tInt : S.tDur]);
  tr.push([prodCol >= 0 ? {f:"IF(" + C(cRec) + t2 + ">0," + C(3 + prodCol * 2) + t2 + "/" + C(cRec) + t2 + ",0)"} : "", S.tPct]);
  s2.push(tr); m2.push("A" + t2 + ":B" + t2);

  /* ชีต 3: หยุดไลน์รายชั่วโมง */
  const s3 = [], h3 = {1: 26};
  title(s3, "หยุดไลน์รายชั่วโมง (นาที)", "ตัวเลขคือจำนวนนาทีที่เป็นสถานะ Stop line ในแต่ละชั่วโมง  ช่องสีแดง = มีการหยุดไลน์");
  const hh = s3.length + 1;
  s3.push([["ช่วงเวลา", S.hd], ...days.map(A => [dname(A) + " " + dm(A), S.hd]), ["รวม", S.hd]]); h3[hh] = 24;
  const lastC = days.length + 1;
  for (let h = 0; h < 24; h++) {
    const r = s3.length + 1, row = [[pad(h) + ":00 – " + pad(h + 1 === 24 ? 0 : h + 1) + ":00", S.txtc]];
    days.forEach(A => {
      const H0 = A + h * 3600e3, H1 = H0 + 3600e3;
      const m = iv.filter(x => STOPS.includes(x.s)).reduce((t, x) => t + clip(x, H0, Math.min(H1, R1)), 0) / 60000;
      row.push([Math.round(m * 10) / 10, m > 0 ? S.h1 : S.h0]);
    });
    row.push([{f:"SUM(B" + r + ":" + C(lastC - 1) + r + ")"}, S.bNum]);
    s3.push(row);
  }
  const t3 = s3.length + 1, tr3 = [["รวมทั้งวัน", S.tTxt]];
  for (let c = 1; c <= lastC; c++) tr3.push([{f:"SUM(" + C(c) + (hh + 1) + ":" + C(c) + (t3 - 1) + ")"}, S.tNum]);
  s3.push(tr3);

  /* ชีต 4: เหตุการณ์ทั้งหมด */
  const s4 = [], m4 = [], h4 = {1: 26};
  title(s4, "รายการเหตุการณ์ทั้งหมด", "ใช้ปุ่มตัวกรองที่หัวตารางเลือกสถานะหรือวันที่ได้ แถวรวมด้านล่างจะคำนวณตามที่กรองไว้");
  const he = s4.length + 1;
  s4.push(["ลำดับ", "วันที่", "วัน", "สถานะ", "เวลาเริ่ม", "เวลาจบ", "ระยะเวลา\n(ชม.:นาที:วินาที)", "ระยะเวลา\n(นาที)", "หมายเหตุ"].map(h => [h, S.hd])); h4[he] = 36;
  iv.forEach((x, i) => s4.push([[i + 1, S.int], [ser(midnight(x.a)), S.date], [dname(x.a), S.txtc], [OPT.s[x.s][0], S.st[x.s]],
    [ser(x.a), S.time], [ser(x.b), endStyle(x, S)], [dd(x.b - x.a), S.dur], [(x.b - x.a) / 60000, S.num], [note(x), S.txt]]));
  const l4 = s4.length, t4 = l4 + 1;
  s4.push([["รวม (ตามตัวกรอง)", S.tTxt], ["", S.tTxt], ["", S.tTxt], [{f:"SUBTOTAL(103,D" + (he + 1) + ":D" + l4 + ")"}, S.tInt], ["ครั้ง", S.tTxt], ["", S.tTxt],
    [{f:"SUBTOTAL(109,G" + (he + 1) + ":G" + l4 + ")"}, S.tDur], [{f:"SUBTOTAL(109,H" + (he + 1) + ":H" + l4 + ")"}, S.tNum], ["", S.tTxt]]);
  m4.push("A" + t4 + ":C" + t4);

  const blob = XL.book([
    {name:"สรุป", xml: XL.sheet(s1, {widths:[18, 12, 18, 12, 12, 14, 12, 22], merges:m1, heights:h1, active:true, onePage:true})},
    {name:"รายวัน", xml: XL.sheet(s2, {widths:[13, 7, ...OPT.s.flatMap(() => [8, 15]), 15, 12], merges:m2, heights:h2, freeze:{r:hr + 1, c:2}, landscape:true})},
    {name:"หยุดไลน์รายชั่วโมง", xml: XL.sheet(s3, {widths:[17, ...days.map(() => 12), 11], heights:h3, freeze:{r:hh, c:1}, landscape:days.length > 4, onePage:true})},
    {name:"เหตุการณ์", filter:"A" + he + ":I" + l4, xml: XL.sheet(s4, {widths:[8, 12, 7, 16, 11, 20, 17, 12, 28], merges:m4, heights:h4,
      freeze:{r:he, c:0}, filter:"A" + he + ":I" + Math.max(l4, he), landscape:true})}
  ], STY);
  const name = "StatusMachine_" + LINE.replace(/[^\w\-]+/g, "") + (day ? "_" + ymd(day) : "_7days_" + ymd(pStart) + "_to_" + ymd(addDays(pStart, PERIOD_DAYS - 1))) + ".xlsx";
  const url = URL.createObjectURL(blob), link = document.createElement("a");
  link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast("ส่งออกแล้ว: " + name);
}

/* ---------- ส่งออกรายงาน HTML (เปิดด้วยเบราว์เซอร์ พิมพ์ได้) ---------- */
function exportHtml(day){
  checkPeriod();
  const now = Date.now(), d0 = midnight(now);
  const R0 = day || pStart, R1 = day ? Math.min(addDays(day, 1), now) : now;
  const a = loadLog();
  const iv = a.map((e, i) => ({s:e.s, a:Math.max(e.t, pStart), b: i + 1 < a.length ? a[i + 1].t : now, live: i === a.length - 1}))
              .filter(x => x.b > x.a && x.b > R0 && x.a < R1);
  const clip = (x, A, B) => Math.max(0, Math.min(x.b, B) - Math.max(x.a, A));
  const E = v => String(v).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c]));
  const full = ts => dm(ts) + "/" + new Date(ts).getFullYear();
  const hms = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); };
  const ymd = ts => { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const T = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); };
  const M = ms => (ms / 60000).toFixed(1);
  const pct = (p, q) => q > 0 ? (p / q * 100).toFixed(1) + "%" : "–";
  const chip = s => '<span class="st" style="background:' + OPT.s[s][1] + ';color:' + (OPT.s[s][2] || "#111") + '">' + E(OPT.s[s][0]) + '</span>';
  const endTxt = x => (x.live ? "ตอนนี้" : (midnight(x.b - 1) !== midnight(x.a) ? dm(x.b) + " " : "") + hms(x.b));
  const days = [];
  if (day) days.push(day); else for (let i = 0; i < PERIOD_DAYS; i++) { const A = addDays(pStart, i); if (A <= d0) days.push(A); }
  const prod = OPT.s.findIndex(o => o[3] === "run");

  // สถิติตามสถานะ
  const st = OPT.s.map((o, s) => {
    const ev = iv.filter(x => x.s === s), ms = ev.map(x => clip(x, R0, R1));
    const tot = ms.reduce((p, q) => p + q, 0), mx = ms.length ? Math.max(...ms) : 0;
    return {s, n: ev.length, tot, mx, mxe: ev[ms.indexOf(mx)]};
  });
  const rec = st.reduce((t, x) => t + x.tot, 0);
  const stopEv = iv.filter(x => STOPS.includes(x.s));
  const stopMs = stopEv.reduce((t, x) => t + clip(x, R0, R1), 0);
  const longest = stopEv.slice().sort((p, q) => (q.b - q.a) - (p.b - p.a));

  const range = day ? "วันที่ " + dayLabel(day) + "/" + new Date(day).getFullYear() : "ช่วงข้อมูล " + full(pStart) + " – " + full(d0);
  let h = '';
  h += '<header><div><h1>รายงานสถานะเครื่อง ' + E(LINE) + '</h1><p>' + range + ' &nbsp;·&nbsp; ข้อมูลถึง ' + full(R1) + ' ' + hms(R1) + '</p></div>' +
       '<p class="meta">ส่งออกเมื่อ ' + full(now) + ' ' + hms(now) + '<br>ไม่นับการเปลี่ยนสถานะที่สั้นกว่า ' + IGNORE_SEC + ' วินาที</p></header>';

  // ตัวเลขสำคัญ
  h += '<section class="kpis">' +
    '<div class="kpi"><span>สัดส่วนเวลาเดินเครื่อง</span><b>' + (prod >= 0 ? pct(st[prod].tot, rec) : "–") + '</b><small>' + (prod >= 0 ? T(st[prod].tot) + ' จาก ' + T(rec) : '') + '</small></div>' +
    '<div class="kpi red"><span>หยุดไลน์</span><b>' + stopEv.length + ' <i>ครั้ง</i></b><small>รวม ' + T(stopMs) + ' (' + M(stopMs) + ' นาที)</small></div>' +
    '<div class="kpi red"><span>หยุดไลน์นานสุด</span><b>' + (longest[0] ? M(longest[0].b - longest[0].a) + ' <i>นาที</i>' : '–') + '</b><small>' +
      (longest[0] ? dayLabel(longest[0].a) + ' ' + hm(longest[0].a) + ' – ' + endTxt(longest[0]) : 'ไม่มีการหยุดไลน์') + '</small></div>' +
    '<div class="kpi"><span>เปลี่ยนสถานะทั้งหมด</span><b>' + iv.length + ' <i>รายการ</i></b><small>เวลาที่บันทึก ' + T(rec) + '</small></div></section>';

  // ไทม์ไลน์
  h += '<section><h2>ไทม์ไลน์</h2><div class="legend">' + OPT.s.map((o, s) => '<span><i style="background:' + o[1] + '"></i>' + E(o[0]) + '</span>').join("") + '</div><div class="tl">';
  days.forEach(A => {
    const B = addDays(A, 1); let segs = "", sm = 0;
    iv.forEach(x => { const w = clip(x, A, Math.min(B, now)); if (!w) return; if (STOPS.includes(x.s)) sm += w;
      segs += '<i style="left:' + ((Math.max(x.a, A) - A) / DAY * 100).toFixed(3) + '%;width:' + (w / DAY * 100).toFixed(3) + '%;background:' + OPT.s[x.s][1] +
        '" title="' + E(OPT.s[x.s][0]) + ' ' + hm(Math.max(x.a, A)) + ' – ' + endTxt(x) + ' (' + M(w) + ' นาที)"></i>'; });
    h += '<div class="tr"><span>' + dayLabel(A) + '</span><div class="bar">' + segs + '</div><span class="' + (sm ? 'red' : 'mut') + '">' + (sm ? 'หยุด ' + M(sm) + ' นาที' : 'ไม่มีหยุดไลน์') + '</span></div>';
  });
  h += '<div class="tr ticks"><span></span><div>' + [0, 3, 6, 9, 12, 15, 18, 21, 24].map(i => '<em style="left:' + (i / 24 * 100) + '%">' + pad(i) + ':00</em>').join("") + '</div><span></span></div></div></section>';

  // สรุปตามสถานะ
  h += '<section><h2>สรุปตามสถานะ</h2><table><thead><tr><th>สถานะ</th><th>จำนวนครั้ง</th><th>เวลารวม</th><th>นาที</th><th>สัดส่วน</th><th>เฉลี่ย/ครั้ง (นาที)</th><th>นานสุด (นาที)</th><th>ครั้งที่นานสุดเริ่ม</th></tr></thead><tbody>' +
    st.map(x => '<tr><td>' + chip(x.s) + '</td><td>' + x.n + '</td><td>' + T(x.tot) + '</td><td>' + M(x.tot) + '</td><td><div class="pbar"><i style="width:' + (rec ? x.tot / rec * 100 : 0) + '%;background:' + OPT.s[x.s][1] + '"></i><span>' + pct(x.tot, rec) + '</span></div></td><td>' +
      (x.n ? M(x.tot / x.n) : '–') + '</td><td>' + (x.n ? M(x.mx) : '–') + '</td><td>' + (x.mxe ? dayLabel(x.mxe.a) + ' ' + hms(x.mxe.a) : '–') + '</td></tr>').join("") +
    '</tbody><tfoot><tr><td>รวมทั้งหมด</td><td>' + iv.length + '</td><td>' + T(rec) + '</td><td>' + M(rec) + '</td><td>100%</td><td>' + (iv.length ? M(rec / iv.length) : '–') + '</td><td>' +
    M(Math.max(0, ...st.map(x => x.mx))) + '</td><td></td></tr></tfoot></table></section>';

  // หยุดไลน์นานสุด 5 อันดับ
  h += '<section><h2>หยุดไลน์นานที่สุด 5 อันดับ</h2>' + (longest.length ? '<table><thead><tr><th>อันดับ</th><th>วัน</th><th>เวลาเริ่ม</th><th>เวลาจบ</th><th>ระยะเวลา</th><th>นาที</th></tr></thead><tbody>' +
    longest.slice(0, 5).map((x, i) => '<tr><td>' + (i + 1) + '</td><td>' + dayLabel(x.a) + '</td><td>' + hms(x.a) + '</td><td>' + endTxt(x) + '</td><td>' + T(x.b - x.a) + '</td><td><b class="red">' + M(x.b - x.a) + '</b></td></tr>').join("") +
    '</tbody></table>' : '<p class="empty">ไม่มีการหยุดไลน์ในช่วงนี้</p>') + '</section>';

  // รายวัน
  if (!day) {
    const tot = OPT.s.map(() => ({n:0, ms:0})); let recAll = 0;
    h += '<section><h2>สรุปรายวัน</h2><table class="daily"><thead><tr><th>วันที่</th>' + OPT.s.map(o => '<th>' + chip(OPT.s.indexOf(o)) + '</th>').join("") + '<th>เวลาที่บันทึก</th><th>สัดส่วนเดินเครื่อง</th></tr></thead><tbody>';
    days.forEach(A => {
      const B = Math.min(addDays(A, 1), now); let r = 0;
      h += '<tr><td>' + dayLabel(A) + '</td>' + OPT.s.map((o, s) => {
        const ev = iv.filter(x => x.s === s && clip(x, A, B) > 0), ms = ev.reduce((t, x) => t + clip(x, A, B), 0);
        tot[s].n += ev.length; tot[s].ms += ms; r += ms;
        return '<td>' + (ev.length ? '<b>' + T(ms) + '</b><small>' + ev.length + ' ครั้ง</small>' : '<span class="mut">–</span>') + '</td>';
      }).join("");
      recAll += r;
      const pm = prod >= 0 ? iv.filter(x => x.s === prod).reduce((t, x) => t + clip(x, A, B), 0) : 0;
      h += '<td>' + T(r) + '</td><td>' + pct(pm, r) + '</td></tr>';
    });
    h += '</tbody><tfoot><tr><td>รวมทั้งหมด</td>' + tot.map(t => '<td><b>' + T(t.ms) + '</b><small>' + t.n + ' ครั้ง</small></td>').join("") +
      '<td>' + T(recAll) + '</td><td>' + (prod >= 0 ? pct(tot[prod].ms, recAll) : '–') + '</td></tr></tfoot></table></section>';
  }

  // หยุดไลน์รายชั่วโมง
  const colTot = days.map(() => 0); let grand = 0;
  h += '<section><h2>หยุดไลน์รายชั่วโมง (นาที)</h2><p class="note">ยิ่งสีแดงเข้ม แปลว่าชั่วโมงนั้นหยุดไลน์นาน</p><table class="heat"><thead><tr><th>ช่วงเวลา</th>' +
    days.map(A => '<th>' + dayLabel(A) + '</th>').join("") + '<th>รวม</th></tr></thead><tbody>';
  for (let hr = 0; hr < 24; hr++) {
    let rt = 0;
    h += '<tr><td>' + pad(hr) + ':00 – ' + pad((hr + 1) % 24) + ':00</td>' + days.map((A, i) => {
      const H0 = A + hr * 3600e3, m = stopEv.reduce((t, x) => t + clip(x, H0, Math.min(H0 + 3600e3, R1)), 0) / 60000;
      rt += m; colTot[i] += m;
      return m > 0 ? '<td class="hot" style="background:rgba(214,47,47,' + (0.12 + Math.min(m / 60, 1) * 0.75).toFixed(2) + ');color:' + (m > 30 ? '#fff' : '#7a1010') + '">' + m.toFixed(1) + '</td>' : '<td class="mut">–</td>';
    }).join("") + '<td class="sum">' + (rt ? rt.toFixed(1) : '–') + '</td></tr>';
    grand += rt;
  }
  h += '</tbody><tfoot><tr><td>รวม</td>' + colTot.map(v => '<td>' + v.toFixed(1) + '</td>').join("") + '<td>' + grand.toFixed(1) + '</td></tr></tfoot></table></section>';

  // เหตุการณ์ทั้งหมด
  h += '<section><h2>เหตุการณ์ทั้งหมด</h2><div class="filters"><button class="on" data-s="all">ทั้งหมด</button>' +
    OPT.s.map((o, s) => '<button data-s="' + s + '"><i style="background:' + o[1] + '"></i>' + E(o[0]) + '</button>').join("") + '</div>' +
    '<table id="ev"><thead><tr><th>#</th><th>วัน</th><th>สถานะ</th><th>เวลาเริ่ม</th><th>เวลาจบ</th><th>ระยะเวลา</th><th>นาที</th><th>หมายเหตุ</th></tr></thead><tbody>' +
    iv.map((x, i) => '<tr data-s="' + x.s + '" data-ms="' + (x.b - x.a) + '"><td>' + (i + 1) + '</td><td>' + dayLabel(x.a) + '</td><td>' + chip(x.s) + '</td><td>' + hms(x.a) + '</td><td>' + endTxt(x) +
      '</td><td>' + T(x.b - x.a) + '</td><td>' + M(x.b - x.a) + '</td><td class="mut">' + (x.live ? 'ยังไม่จบ (นับถึงเวลาส่งออก)' : midnight(x.b - 1) !== midnight(x.a) ? 'ข้ามวัน' : '') + '</td></tr>').join("") +
    '</tbody><tfoot><tr><td colspan="2">รวม (ตามที่เลือก)</td><td id="evN"></td><td></td><td></td><td id="evT"></td><td id="evM"></td><td></td></tr></tfoot></table></section>';

  const css = `

  const js = `
const rows=[...document.querySelectorAll('#ev tbody tr')],btn=[...document.querySelectorAll('.filters button')];
const T=ms=>{const s=Math.round(ms/1000),p=n=>String(n).padStart(2,'0');return Math.floor(s/3600)+':'+p(Math.floor(s/60)%60)+':'+p(s%60)};

document.getElementById('evN').textContent=n+' ครั้ง';document.getElementById('evT').textContent=T(ms);document.getElementById('evM').textContent=(ms/60000).toFixed(1)}

  const doc = '<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>รายงานสถานะ ' + E(LINE) + ' ' + (day ? ymd(day) : ymd(pStart) + ' ถึง ' + ymd(d0)) + '</title><style>' + css + '</style></head><body><main>' + h +
    '</main><div class="toolbar"><button onclick="print()">พิมพ์ / บันทึก PDF</button></div><script>' + js + '<\/script></body></html>';
  const name = "StatusReport_" + LINE.replace(/[^\w\-]+/g, "") + (day ? "_" + ymd(day) : "_7days_" + ymd(pStart) + "_to_" + ymd(addDays(pStart, PERIOD_DAYS - 1))) + ".html";
  const url = URL.createObjectURL(new Blob([doc], {type:"text/html;charset=utf-8"})), link = document.createElement("a");
  link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast("ส่งออกแล้ว: " + name);
}
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3500); }

/* เมนูหน้าบันทึก: เลื่อนด้วย ▲▼ กด OK เลือก ◀ ปิด */
let menuOpen = false, mIdx = 0, mItems = [];
const MI = {
  back:'<path d="M15 5l-7 7 7 7"/>',
  xl:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  html:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>'
};
function buildMenu(){
  const d0 = midnight(Date.now());
  mItems = [
    {ic:"back", t:"กลับหน้าป้าย", run:() => { closeMenu(); showPage(1); }},
    {ic:"xl", cls:"xl", t:"ส่งออก Excel เฉพาะวันที่เลือก", sub:(selDay === d0 ? "วันนี้ " : "") + dayLabel(selDay), run:() => { closeMenu(); exportExcel(selDay); }},
    {ic:"xl", cls:"xl", t:"ส่งออก Excel ทั้งรอบ 7 วัน", sub:dm(pStart) + " – " + dm(addDays(pStart, PERIOD_DAYS - 1)), run:() => { closeMenu(); exportExcel(null); }},
    {ic:"html", cls:"ht", t:"ส่งออก HTML เฉพาะวันที่เลือก", sub:(selDay === midnight(Date.now()) ? "วันนี้ " : "") + dayLabel(selDay), run:() => { closeMenu(); exportHtml(selDay); }},
    {ic:"html", cls:"ht", t:"ส่งออก HTML ทั้งรอบ 7 วัน", sub:dm(pStart) + " – " + dm(addDays(pStart, PERIOD_DAYS - 1)), run:() => { closeMenu(); exportHtml(null); }},
    {ic:"list", t:"แสดง Production ในรายการ", sub:evAll ? "เปิดอยู่" : "ปิดอยู่", run:() => { evAll = !evAll; evPage = 0; renderLog(false); buildMenu(); }},
    {ic:"close", t:"ปิดเมนู", run:closeMenu}
  ];
  $("mlist").innerHTML = mItems.map((m, i) => '<button class="mi' + (m.cls ? ' ' + m.cls : '') + (i === mIdx ? ' cur' : '') + '" data-i="' + i + '">' +
    '<svg viewBox="0 0 24 24">' + MI[m.ic] + '</svg>' + m.t + (m.sub ? '<small>' + m.sub + '</small>' : '') + '</button>').join("");
}
function openMenu(i){ mIdx = i || 0; menuOpen = true; buildMenu(); $("menu").classList.add("on"); armBack(); }
function closeMenu(){ menuOpen = false; $("menu").classList.remove("on"); }
$("mlist").addEventListener("click", e => { const b = e.target.closest(".mi"); if (b) { mIdx = +b.dataset.i; mItems[mIdx].run(); armBack(); } });
$("menu").addEventListener("click", e => { if (e.target.id === "menu") closeMenu(); });
$("exportXl").addEventListener("click", () => openMenu(1));

function commit(n, ch){
  st = n;
  if (ch.includes("s")) {
    since = Date.now();
    try { localStorage.setItem("smt-since", since); } catch(e){}
    checkPeriod(); logStatus(st.s, since);
  }
  try { localStorage.setItem("smt-status", JSON.stringify(st)); } catch(e){}
  render(ch); tick();
  if (ch.includes("s")) renderLog(true);
}
function apply(o){
  const n = clean(o), ch = KEYS.filter(k => n[k] !== st[k]);
  if (ch.length) commit(n, ch);
}
function setKey(k, v){
  commit(Object.assign({}, st, {[k]: v}), [k]);
  if (bc) bc.postMessage(st);
  if (SRC) fetch(SRC + "/set?p=" + st.p + "&s=" + st.s, {mode:"no-cors"}).catch(() => {});
}
function step(k, d){ const n = OPT[k].length; setKey(k, (st[k] + d + n) % n); }

/* นาฬิกา และระยะเวลาที่อยู่ในสถานะปัจจุบัน */
function tick(){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  $("clk").textContent = SHOW_CLOCK ? "เวลา " + t : "";
  $("lpClk").textContent = "เวลา " + t;
  const s = Math.max(0, Math.floor((Date.now() - since) / 1000));
  $("ts").textContent = SHOW_TIMER ? "ระยะเวลา " + pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60) : "";
}
setInterval(() => { tick(); tickLog(); }, 1000);

if (bc) bc.onmessage = e => apply(e.data);
addEventListener("storage", e => {
  if (e.key === "smt-status" && e.newValue) apply(JSON.parse(e.newValue));
  else if (e.key === "smt-log" || e.key === "smt-period") { checkPeriod(); renderLog(false); }
});
if (SRC) setInterval(() => {
  fetch(SRC + "/state", {cache:"no-store"}).then(r => r.json()).then(apply).catch(() => {});
}, 700);

/* สลับหน้า ป้าย <-> บันทึกสถานะ */
let backTimer;
function armBack(){
  clearTimeout(backTimer);
  if (BACK > 0 && document.body.classList.contains("p2")) backTimer = setTimeout(() => showPage(1), BACK * 1000);
}
function showPage(n){
  const p2 = n === 2;
  if (p2 === document.body.classList.contains("p2")) return;
  document.body.classList.toggle("p2", p2);
  if (!p2) closeMenu();
  if (p2) { selDay = midnight(Date.now()); evPage = 0; renderLog(false); }
  retrigger($(p2 ? "logp" : "disp"), "pagein");
  armBack();
}
$("toLog").addEventListener("click", () => showPage(2));
const tip = $("tip"); let tipT;
function showTip(seg, cx, cy){
  const x = IV[+seg.dataset.k]; if (!x) return;
  const o = OPT.s[x.s];
  tip.innerHTML = '<span class="dot" style="background:' + o[1] + '"></span><b>' + o[0] + '</b>' + dayLabel(x.a) + ' ' + hm(x.a) +
    ' – ' + (x.live ? 'ตอนนี้' : (midnight(x.b) !== midnight(x.a) ? dayLabel(x.b) + ' ' : '') + hm(x.b)) +
    '<span class="tdu">' + durText(x.b - x.a) + '</span>';
  const w = tip.offsetWidth / 2 + 8;
  tip.style.left = Math.min(Math.max(cx, w), innerWidth - w) + "px";
  tip.style.top = cy + "px";
  tip.classList.add("on");
}
$("weekRows").addEventListener("mousemove", e => {
  const seg = e.target.closest(".seg");
  if (seg) showTip(seg, e.clientX, seg.getBoundingClientRect().top); else tip.classList.remove("on");
});
$("weekRows").addEventListener("mouseleave", () => tip.classList.remove("on"));
$("weekRows").addEventListener("click", e => {
  const row = e.target.closest(".wrow"), seg = e.target.closest(".seg");
  if (!row || row.classList.contains("fut")) return;
  armBack();
  if (seg) {
    const k = +seg.dataset.k;
    if (IV[k] && (evAll || !LOG_SKIP.includes(IV[k].s))) hlK = k;
  }
  pickDay(+row.dataset.day);
  if (seg) {                                       // จอสัมผัส: โชว์เวลาแล้วซ่อนเอง
    const s2 = $("weekRows").querySelector('.seg[data-k="' + seg.dataset.k + '"]');
    if (s2) { showTip(s2, e.clientX, s2.getBoundingClientRect().top); clearTimeout(tipT); tipT = setTimeout(() => tip.classList.remove("on"), 3500); }
  }
});
$("evAll").addEventListener("click", () => { evAll = !evAll; evPage = 0; renderLog(false); armBack(); });
$("evPrev").addEventListener("click", () => { pageEv(-1); armBack(); });
$("evNext").addEventListener("click", () => { pageEv(1); armBack(); });
$("toSign").addEventListener("click", () => showPage(1));

/* รีโมต/คีย์บอร์ด */
// กันกดซ้ำ: ไม่รับการกดค้าง (repeat) และเว้นช่วงระหว่างการกด
let lastAct = 0;
function allowed(ms){ const t = Date.now(); if (t - lastAct < ms) return false; lastAct = t; return true; }
// กดครั้งแรกหลังเงียบไปสักพักจะแค่ปลุกกรอบเลือกให้เห็น ยังไม่เปลี่ยนค่า กันกดผิดช่อง
let selIdx = 0, selActive = false, selTimer;
const SELS = ["cp","cs"];
function showSel(){
  selActive = true;
  SELS.forEach((id,i) => $(id).classList.toggle("sel", i === selIdx));
  clearTimeout(selTimer);
  selTimer = setTimeout(() => { selActive = false; SELS.forEach(id => $(id).classList.remove("sel")); }, 4000);
}
// ปุ่มลูกศรของรีโมต (บางรุ่นส่งเป็น keyCode)
const KEYMAP = {ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",38:"u",40:"d",37:"l",39:"r"};
addEventListener("keydown", e => {
  const body = document.body, onCtl = body.classList.contains("ctl"), onLog = body.classList.contains("p2");
  if (e.key === "c" || e.key === "C") { body.classList.toggle("ctl"); return; }
  if (onCtl) return;                                       // หน้าควบคุมใช้ปุ่มตามปกติ
  if (onLog) armBack();
  const ok = e.key === "Enter" || e.keyCode === 13 || e.keyCode === 23 || e.key === "l" || e.key === "L";
  const a = KEYMAP[e.key] || KEYMAP[e.keyCode];
  if (onLog && menuOpen) {                                 // อยู่ในเมนู
    const close = a === "l" || e.key === "Escape" || e.key === "Backspace";
    if (!ok && !a && !close) return;
    e.preventDefault();
    if (!allowed(150)) return;
    if (ok) { if (!e.repeat) mItems[mIdx].run(); }
    else if (a === "u" || a === "d") { mIdx = (mIdx + (a === "u" ? -1 : 1) + mItems.length) % mItems.length; buildMenu(); }
    else if (close) closeMenu();
    return;
  }
  if (ok) { e.preventDefault(); if (!e.repeat && allowed(300)) { if (onLog) openMenu(0); else showPage(2); } return; }
  if (onLog && (e.key === "Escape" || e.key === "Backspace")) { e.preventDefault(); showPage(1); return; }
  if (!a) return;
  e.preventDefault();
  if (onLog) {                                             // หน้าบันทึก: ขึ้น/ลง เลือกวัน ซ้าย/ขวา เปลี่ยนหน้ารายการ (ไม่เปลี่ยนสถานะเครื่อง)
    if (!allowed(150)) return;
    if (a === "u" || a === "d") moveDay(a === "u" ? -1 : 1); else pageEv(a === "l" ? -1 : 1);
    return;
  }
  if (e.repeat || !allowed(250)) return;
  if (!selActive) { showSel(); return; }
  if (a === "u" || a === "d") selIdx = (selIdx + 1) % 2;
  else step(KEYS[selIdx], a === "l" ? -1 : 1);
  showSel();
}, true);
document.querySelectorAll("#ctl .row button").forEach(b =>
  b.addEventListener("click", () => { if (allowed(150)) step(b.dataset.k, parseInt(b.dataset.d, 10)); }));
$("toDisp").addEventListener("click", () => { document.body.classList.remove("ctl"); showPage(1); });
$("toDisp2").addEventListener("click", () => { document.body.classList.remove("ctl"); showPage(2); });
$("clearLog").addEventListener("click", () => {
  if (!confirm("ล้างบันทึกสถานะทั้งหมดในเครื่องนี้ และเริ่มรอบ 7 วันใหม่ตั้งแต่วันนี้?")) return;
  try { localStorage.removeItem("smt-log"); localStorage.setItem("smt-period", midnight(Date.now())); } catch(e){}
  pStart = 0; checkPeriod(); logStatus(st.s, Date.now()); renderLog(false);
});
["disp","logp"].forEach(id => $(id).addEventListener("dblclick", e => {

if (qs.get("demo")) {

addEventListener("click", () => window.focus());
checkPeriod();
logStatus(st.s, since);

tick();
